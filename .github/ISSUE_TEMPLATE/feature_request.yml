name: A wish
description: A tool, a format or a change you would like
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, in your own words. What data, and what should come out?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In another program, such as FME or QGIS, or by hand. A transformer or tool that does it elsewhere helps.
