name: A wish
description: A tool, a format or a change you would like
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, in your own words. What data goes in, and what should come out?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of wish
      options:
        - A new tool
        - A format to read or write
        - A change to a tool that is there
        - The program (canvas, forms, map, table)
        - The command line or AI assistants
        - Something else
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In another program, with a script, or by hand. What works and what does not.
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A small file, a link to a sample or a standard, or a picture of what the result should look like.
