# Builds and tests on Linux at every push and pull request. The tests of the program (og-gui)
# need a graphics driver and are left to be run locally; see CONTRIBUTING.md.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: GDAL
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev clang pkg-config
      # The version the code is checked with. A newer Rust brings new lints of clippy,
      # which would turn the check red with no change to the code; it is raised by hand.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude og-gui
