# Dependabot proposes updates as pull requests: at once when a library has a security
# hole with a fixed version, and once a week the others that are compatible, gathered in
# one pull request. The Check and Security workflows then run on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # resvg draws the icons of maps into the pictures of tiny-skia, so the two must use the
      # same tiny-skia and are updated together.
      drawing:
        patterns: [resvg, usvg, tiny-skia]
      # geo works on the trees of rstar that Ographis builds, so they follow each other.
      geometry:
        patterns: [geo, geo-types, rstar, spade]
      # Compatible updates in one pull request. New major versions, which may need changes
      # to the code, come one by one.
      compatible:
        update-types: [minor, patch]
    ignore:
      # egui, eframe and the libraries around them are moved to a new version together, by
      # hand, with the patched egui-snarl in vendor/. Their fixes within a version still come.
      - dependency-name: "egui*"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: eframe
        update-types: [version-update:semver-minor, version-update:semver-major]
      # rstar follows geo, which still uses rstar 0.12 (geo 0.33). Take this away when geo
      # moves on, and the geometry group brings them together.
      - dependency-name: rstar
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
